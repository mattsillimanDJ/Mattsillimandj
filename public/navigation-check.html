<!doctype html><html><head><meta name="robots" content="noindex"><title>Navigation viewport checks</title><style>body{font:14px system-ui;margin:12px;background:#ddd}iframe{display:block;border:1px solid #888;margin-top:12px;background:black}label{margin-right:16px}</style></head><body><label>Viewport <select id="size"><option>320x568</option><option>375x667</option><option selected>390x844</option><option>430x932</option><option>768x1024</option><option>844x390</option><option>1440x900</option></select></label><label>Site <select id="site"><option value="/">Preview</option><option value="https://www.mattsillimandj.com/">Live baseline</option></select></label><button id="down">Scroll down</button><button id="up">Scroll up</button><iframe id="viewport" title="Website viewport" width="390" height="844" src="/"></iframe><script>const frame=document.getElementById('viewport');document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split('x');frame.width=w;frame.height=h;};document.getElementById('site').onchange=e=>frame.src=e.target.value;document.getElementById('down').onclick=()=>frame.contentWindow.scrollTo(0,1000);document.getElementById('up').onclick=()=>frame.contentWindow.scrollTo(0,400);</script></body></html>
